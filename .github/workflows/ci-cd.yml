name: UCCS-CS4300-5300 Group 5 Ci-Cd

# Define global environment variables here
env:
  MAIN_FOLDER: "project"
  API_URL: "https://example.com"

# 1. When should this run?
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
#   types:
#     pull_request:
#       - opened
#       - synchronize 
#       - reopened
#       - edited

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Uses a free Linux computer provided by GitHub

    steps:
      # Step 1: Copy the project code onto the GitHub computer
      - name: Get project code
        uses: actions/checkout@v4
  
      # Install prerequisites
      - name: Install Prerequisites
        run: |
          pushd $MAIN_FOLDER > /dev/null 2>&1
            echo "Installing Requirements:\n"
            for i in `cat requirements.txt`; do 
              echo "$i"
            done
            pip install -r requirements.txt
          popd > /dev/null 2>&1
  
       # Setup python system
      - name: Setup Python Prerequisites
        run: |
          pushd $MAIN_FOLDER > /dev/null 2>&1
            # need to feed the prompt yes... :)
            yes yes | python manage.py flush
            python manage.py makemigrations
            python manage.py migrate
          popd > /dev/null 2>&1

      # Run the unit tests and collect statement + branch coverage
      - name: Unit Tests and Coverage
        run: |
          # Make the step fail if pytest fails, even though the output is piped through tee
          set -o pipefail
          pushd $MAIN_FOLDER > /dev/null 2>&1
            python -m pytest \
              --cov=. \
              --cov-branch \
              --cov-report=term-missing \
              --log-cli-level=DEBUG \
              -o log_file=app.log \
              | tee coverage.txt

            # Add the coverage results to the GitHub Actions summary
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 20 coverage.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          popd > /dev/null 2>&1

      # Setup python system
      - name: Test the Server to Ensure it Runs
        run: |  
          pushd $MAIN_FOLDER > /dev/null 2>&1
            # Arrange
            echo "python manage.py runserver 0.0.0.0:8000"

            # Act
            # Run server in background
            python manage.py runserver 0.0.0.0:8000 &

            # wait for system to come up
            sleep 5

            # Assert
            echo " curl 127.0.0.1:8000/"
            curl 127.0.0.1:8000/
          popd > /dev/null 2>&1

