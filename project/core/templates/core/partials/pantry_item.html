<div class="item-circle">
    <div class="container">
        {{ product.catalog_item.name }}
        <br/>

        Quantity: {{ product.quantity }}
        <br/>

        <span class="status-label">
            Status: {{ product.expiration_status }}
        </span>

        {% if product.expiration_status != 'Expired' %}
            <button type="button" class="btn"
                onclick="window.location.href='{% url 'core:pantry_item_detail' product.id %}'">
                View Details
            </button>
        {% endif %}

        <br/>

        <button type="button" class="btn"
            onclick="document.getElementById('edit-dialog-{{ product.id }}').showModal()">
            Edit
        </button>

        <form action="{% url 'core:delete_pantry_item' product.id %}"
              method="POST"
              class="inline-form">
            {% csrf_token %}
            <button type="submit"
                    class="btn btn-delete"
                    onclick="return confirm('Are you sure you want to delete this item?');">
                Delete
            </button>
        </form>

        <dialog id="edit-dialog-{{ product.id }}" class="edit-dialog">
            <h3>Edit {{ product.catalog_item.name }}</h3>

            <form action="{% url 'core:edit_pantry_item' product.id %}" method="POST">
                {% csrf_token %}
                {{ product.edit_form.as_p }}

                <button type="submit">Save</button>
                <button type="button" onclick="this.closest('dialog').close()">
                    Cancel
                </button>
            </form>
        </dialog>
    </div>
</div>
